<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serca Gear Planner — Weekly Thorn Budget</title>
<link rel="icon" href="assets/walrus.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg-0: #111114;
    --bg-1: #17171b;
    --bg-2: #1e1e23;
    --bg-3: #26262d;
    --bg-4: #2d2d36;
    --border: #33333c;
    --border-hi: #4a4a56;
    --text: #e6e6ea;
    --text-dim: #a3a3ac;
    --text-faint: #6b6b76;
    --accent: #9b85d6;
    --accent-dim: #6f5fa3;
    --thorn: #e0b85c;
    --thorn-glow: #f2cd75;
    --frag: #7ab0cc;
    --frag-glow: #9dcce3;
    --danger: #c85a5a;
    --danger-deep: #6a2626;
    --success: #6fa85a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root { position: relative; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 1.25rem 1rem 0.75rem;
  }
  .header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 3vw, 1.8rem);
    letter-spacing: 0.1em;
    color: var(--text);
    margin: 0;
  }

  /* LEDGER */
  .ledger {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(23, 23, 27, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    gap: 2rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .ledger-pool {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .pool-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ledger-pool.thorn .pool-icon { color: var(--thorn); }
  .ledger-pool.frag .pool-icon { color: var(--frag); }
  .pool-data {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }
  .pool-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--text);
  }
  .ledger-pool.thorn .pool-value { color: var(--thorn-glow); }
  .ledger-pool.frag .pool-value { color: var(--frag-glow); }
  .pool-label {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-faint);
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }
  .ledger-reset {
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border);
    padding: 0.45rem 0.9rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    border-radius: 999px;
  }
  .ledger-reset:hover {
    background: var(--danger-deep);
    color: var(--text);
    border-color: var(--danger);
  }

  /* WEEKS — horizontal row that wraps to new rows as needed */
  .weeks-scroll {
    padding: 2rem 1.5rem 1.5rem;
  }
  .weeks {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 1.1rem;
    position: relative;
  }

  /* Small "add" pill buttons on each pill's top and bottom edges.
     Styled to mirror the delete pill, always fully visible. */
  .week-add-vert {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-1);
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 0.3rem 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    border-radius: 999px;
    z-index: 6;
    line-height: 1;
    white-space: nowrap;
  }
  .week-add-vert:hover {
    background: var(--accent-dim);
    color: var(--text);
    border-color: var(--accent);
  }
  .week-add-vert.top    { top: -12px; }
  .week-add-vert.bottom { bottom: -12px; }

  /* Small "+" pinned to the right edge of each row (desktop only).
     One per non-final row; the big end pill handles the final row.
     These are absolutely positioned so they never wrap. */
  .row-end-add { display: none; }
  @media (min-width: 768px) {
    .weeks { padding-right: 48px; }
    .row-end-add {
      display: flex;
      position: absolute;
      right: 6px;
      width: 34px;
      height: 34px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--bg-2);
      border: 1px dashed var(--border-hi);
      color: var(--accent);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1;
      transition: all 0.15s;
      z-index: 5;
      padding: 0;
    }
    .row-end-add:hover {
      background: var(--bg-3);
      border-style: solid;
      border-color: var(--accent);
      color: var(--text);
    }
  }

  .week {
    flex: 1 1 290px;
    min-width: min(270px, 100%);
    max-width: 340px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 1.25rem 1.25rem;
    position: relative;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
  }
  .week.broken {
    border-color: var(--danger);
    box-shadow: 0 0 0 1px var(--danger) inset, 0 2px 12px rgba(0, 0, 0, 0.25);
  }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .week-title {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .week-num {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
  }
  .week-delete {
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border);
    padding: 0.3rem 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    border-radius: 999px;
  }
  .week-delete:hover {
    background: var(--danger-deep);
    color: var(--text);
    border-color: var(--danger);
  }

  /* GATES — stacked vertically so they fit comfortably in the narrow pill */
  .gates {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    margin-bottom: 1.1rem;
  }

  .gate {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 0.75rem 0.9rem;
    border-radius: 16px;
  }
  .gate-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.7rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .gate-label .tag {
    font-weight: 600;
  }
  .gate-drops {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 0;
    text-transform: none;
  }
  .gate-drops .val { color: var(--thorn); }
  .gate-drops .val.frag { color: var(--frag); }

  .diff-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.3rem;
    margin-bottom: 0.6rem;
  }
  .diff-btn {
    background: var(--bg-3);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.45rem 0.4rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 18px;
    white-space: pre-line;
    line-height: 1.15;
  }
  .diff-btn:hover {
    background: var(--bg-4);
    color: var(--text);
    border-color: var(--border-hi);
  }
  .diff-btn.active {
    background: var(--accent-dim);
    color: var(--text);
    border-color: var(--accent);
  }
  .diff-btn.active.skippable {
    cursor: pointer;
  }

  .extra-reward {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.45rem 0.65rem;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .extra-reward:hover {
    background: var(--bg-4);
    border-color: var(--border-hi);
  }
  .extra-reward.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .extra-reward input {
    accent-color: var(--accent);
    width: 13px;
    height: 13px;
    cursor: inherit;
  }
  .extra-reward label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    cursor: inherit;
    flex: 1;
  }

  /* ACTIONS */
  .actions-section-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 0.55rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .actions-section-label::before,
  .actions-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .action-stack {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 1.1rem;
  }
  .action-btn {
    background: var(--bg-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.6rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-align: left;
    width: 100%;
  }
  .action-btn:not(:disabled):hover {
    background: var(--bg-3);
    color: var(--text);
    border-color: var(--border-hi);
  }
  .action-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .action-btn.committed {
    background: rgba(155, 133, 214, 0.18);
    border-color: var(--accent);
    color: var(--text);
  }
  .action-btn.committed .action-verb { color: var(--text); }
  .action-btn.committed .action-icon { color: var(--accent); }
  .action-btn.committed::after {
    content: '✓';
    color: var(--accent);
    font-size: 0.85rem;
    margin-left: 0.2rem;
  }
  .action-btn.broken {
    background: rgba(200, 90, 90, 0.12);
    border-color: var(--danger);
    color: var(--danger);
    cursor: pointer;
    opacity: 1;
  }
  .action-btn.broken .action-verb,
  .action-btn.broken .action-icon,
  .action-btn.broken .action-cost { color: var(--danger); }
  .action-btn.broken .action-name { text-decoration: line-through; }
  .action-reason {
    font-size: 0.68rem;
    font-style: italic;
    font-weight: normal;
    margin-left: 0.4rem;
    opacity: 0.9;
  }
  .action-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:not(:disabled):hover .action-icon { color: var(--accent); }
  .action-verb {
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    min-width: 72px;
  }
  .action-name { flex: 1; }
  .action-cost {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--thorn);
    font-weight: 500;
  }

  .empty-msg {
    text-align: center;
    padding: 0.75rem;
    color: var(--text-faint);
    font-style: italic;
    font-size: 0.82rem;
  }

  /* RUNNING TOTAL */
  .week-running {
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px dashed var(--border);
    display: flex;
    gap: 1.2rem;
    justify-content: flex-end;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .week-running-item {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .week-running-label {
    color: var(--text-faint);
    font-size: 0.64rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .week-running-val { color: var(--thorn-glow); }
  .week-running-val.frag { color: var(--frag-glow); }

  /* ADD WEEK BUTTON — sits at the end of the horizontal row */
  .add-week {
    flex: 0 0 auto;
    align-self: stretch;
    min-height: 200px;
    min-width: min(160px, 100%);
    background: transparent;
    color: var(--accent);
    border: 1px dashed var(--border-hi);
    padding: 1.5rem 1.75rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .add-week:hover {
    background: var(--bg-2);
    border-color: var(--accent);
    border-style: solid;
    color: var(--text);
  }
  .add-week-icon {
    font-size: 2rem;
    font-weight: 300;
    line-height: 1;
  }

  /* Walrus + palm decorations (junglewalrus brand) */
  .header .title-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .palm { width: 44px; height: auto; flex: 0 0 auto; opacity: .95; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .palm-flip { transform: scaleX(-1); }
  .footer-credit {
    display: flex; align-items: center; justify-content: center; gap: 13px;
    max-width: 640px; margin: 0 auto; text-align: left; padding: 24px 16px 8px;
    color: var(--text-faint); font-size: 0.75rem;
  }
  .footer-credit a { color: var(--accent); text-decoration: none; }
  .footer-walrus { width: 62px; height: auto; flex: 0 0 auto; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  @media (max-width: 560px) {
    .palm { width: 30px; } .header .title-row { gap: 9px; }
    .footer-walrus { width: 48px; }
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    border-top: 1px solid var(--border);
  }
  .footer .config-toggle {
    background: transparent;
    color: var(--text-faint);
    border: none;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
  }
  .footer .config-toggle:hover { color: var(--accent); }

  .config-panel {
    max-width: 800px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: left;
    line-height: 1.7;
  }
  .config-panel h3 {
    font-family: 'Inter', sans-serif;
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    margin-bottom: 0.9rem;
    text-transform: uppercase;
  }
  .config-panel code {
    color: var(--thorn);
  }

  /* Standardized site footer — source link, GitHub, socials */
  .site-footer {
    text-align: center;
    padding: 1.25rem 1rem 2.5rem;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
  }
  .site-footer p { margin: 4px 0; }
  .site-footer a {
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.15s;
  }
  .site-footer a:hover { color: var(--accent); }
  .footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  .footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
  }
  .footer-links a:hover { color: var(--accent); }
  .footer-links .dot { color: var(--border-hi); }
  .icon {
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
  }
</style>
</head>

      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

</footer>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* ────────────────────────────────────────────────────────────
 * CONFIG — All tunable numbers. Edit here if the game changes.
 * ──────────────────────────────────────────────────────────── */
const CONFIG = {
  // How many materials each gate drops at each difficulty.
  // Hard and Nightmare are merged (confirmed same drops).
  // Normal drops "Fragmented" (spendable 1:1 with Thorns).
  drops: {
    1: {
      normal: { thorn: 0,  frag: 4 },
      hard:   { thorn: 10, frag: 0 },
    },
    2: {
      normal: { thorn: 0,  frag: 6 },
      hard:   { thorn: 15, frag: 0 },
    },
  },

  extraRewardMultiplier: 2,

  slotCost: {
    weapon:    40,
    helm:      15,
    chest:     15,
    gloves:    15,
    pants:     15,
    shoulders: 15,
  },

  slots: [
    { id: 'weapon',    name: 'Weapon'    },
    { id: 'helm',      name: 'Helm'      },
    { id: 'chest',     name: 'Chest'     },
    { id: 'gloves',    name: 'Gloves'    },
    { id: 'pants',     name: 'Pants'     },
    { id: 'shoulders', name: 'Shoulders' },
  ],
};

// Gate 1 is mandatory (no skip). Gate 2 can be skipped by clicking
// the active button again (difficulty becomes null).
const DIFFICULTIES = [
  { id: 'normal', label: 'Normal'    },
  { id: 'hard',   label: 'Hard\n/ NM' },
];

/* ────────────────────────────────────────────────────────────
 * Icons
 * ──────────────────────────────────────────────────────────── */
const ThornIcon = () => (
  <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
    <path d="M12 2 L13.5 8 L19 6 L15 11 L22 13 L15 14 L19 19 L13 17 L12 22 L11 17 L5 19 L9 14 L2 13 L9 11 L5 6 L11 8 Z" opacity="0.9"/>
    <circle cx="12" cy="13" r="1.4" opacity="0.5"/>
  </svg>
);

const FragIcon = () => (
  <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
    <path d="M12 3 L16 9 L14 13 L18 16 L13 17 L11 22 L9 16 L4 15 L8 11 L7 5 Z" opacity="0.85"/>
  </svg>
);

// Generic gear-slot silhouettes. Not class-specific — works for any player.
const GearIcons = {
  weapon: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M11 2 L13 2 L13 14 L15 14 L15 16 L13 16 L13 18 L15 18 L15 20 L12 22 L9 20 L9 18 L11 18 L11 16 L9 16 L9 14 L11 14 Z"/>
    </svg>
  ),
  helm: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M12 3 C7.5 3 5 6 5 10 L5 15 L7 15 L7.5 18 L9 18 L9 16 L15 16 L15 18 L16.5 18 L17 15 L19 15 L19 10 C19 6 16.5 3 12 3 Z M8 10 L16 10 L16 12 L8 12 Z" opacity="0.95"/>
    </svg>
  ),
  chest: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M8 3 L10.5 4 L12 6 L13.5 4 L16 3 L19 5 L19 8 L18 10 L18 20 L15 20.5 L12 19.5 L9 20.5 L6 20 L6 10 L5 8 L5 5 Z" opacity="0.95"/>
    </svg>
  ),
  gloves: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M8 4 L11 3 L13 3 L16 4 L16 11 L17 13 L17 20 L15 21 L9 21 L7 20 L7 13 L8 11 Z M9 6 L9 11 L15 11 L15 6 Z" opacity="0.95"/>
    </svg>
  ),
  pants: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M7 3 L17 3 L17.5 8 L16 21 L13 21 L12 11 L11 21 L8 21 L6.5 8 Z" opacity="0.95"/>
    </svg>
  ),
  shoulders: (
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
      <path d="M4 10 C4 6 7.5 3 12 3 C16.5 3 20 6 20 10 L20 16 L17 18 L14 17 L12 16 L10 17 L7 18 L4 16 Z M8 9 L16 9 L16 13 L8 13 Z" opacity="0.95"/>
    </svg>
  ),
};

/* ────────────────────────────────────────────────────────────
 * Helpers
 * ──────────────────────────────────────────────────────────── */

function earnedForWeek(week) {
  const total = { thorn: 0, frag: 0 };
  for (const gateNum of [1, 2]) {
    const diff = week.gates[gateNum].difficulty;
    if (!diff) continue;                      // gate skipped (G2 only)
    const extra = week.gates[gateNum].extra;
    const base = CONFIG.drops[gateNum][diff];
    const mult = extra ? CONFIG.extraRewardMultiplier : 1;
    total.thorn += base.thorn * mult;
    total.frag  += base.frag  * mult;
  }
  return total;
}

function totalPool(running) {
  return running.thorn + running.frag;
}

function spend(running, cost) {
  const next = { thorn: running.thorn, frag: running.frag };
  let rem = cost;
  const fragSpent = Math.min(rem, next.frag);
  next.frag -= fragSpent;
  rem -= fragSpent;
  const thornSpent = Math.min(rem, next.thorn);
  next.thorn -= thornSpent;
  rem -= thornSpent;
  return { next, ok: rem === 0 };
}

/* ────────────────────────────────────────────────────────────
 * Engine
 * ──────────────────────────────────────────────────────────── */
function simulate(weeks) {
  let running = { thorn: 0, frag: 0 };
  const ownedCraft = new Set();
  const ownedBreakthrough = new Set();

  const weekResults = weeks.map((week) => {
    const earned = earnedForWeek(week);
    running.thorn += earned.thorn;
    running.frag  += earned.frag;

    const earnedAfter = { thorn: running.thorn, frag: running.frag };
    const actionResults = [];

    for (const action of week.actions) {
      const cost = CONFIG.slotCost[action.slot];
      let broken = false;
      let reason = null;

      if (action.type === 'craft') {
        if (ownedCraft.has(action.slot)) { broken = true; reason = 'already crafted'; }
      } else if (action.type === 'breakthrough') {
        if (!ownedCraft.has(action.slot)) { broken = true; reason = 'not crafted yet'; }
        else if (ownedBreakthrough.has(action.slot)) { broken = true; reason = 'already broken through'; }
      }

      if (!broken) {
        const { next, ok } = spend(running, cost);
        if (!ok) { broken = true; reason = 'insufficient mats'; }
        else {
          running = next;
          if (action.type === 'craft') ownedCraft.add(action.slot);
          else ownedBreakthrough.add(action.slot);
        }
      }

      actionResults.push({ ...action, cost, broken, reason });
    }

    return {
      week,
      earned,
      earnedAfter,
      running: { ...running },
      actions: actionResults,
      anyBroken: actionResults.some(a => a.broken),
    };
  });

  return { weekResults, finalRunning: running, ownedCraft, ownedBreakthrough };
}

function availabilityAt(weeks, targetIdx) {
  const prior = targetIdx > 0
    ? simulate(weeks.slice(0, targetIdx))
    : { ownedCraft: new Set(), ownedBreakthrough: new Set() };
  const priorCraft = prior.ownedCraft;
  const priorBT = prior.ownedBreakthrough;

  const targetResult = simulate(weeks.slice(0, targetIdx + 1)).weekResults[targetIdx];

  const craftThisWeek = new Map();
  const btThisWeek = new Map();
  targetResult.actions.forEach(a => {
    if (a.type === 'craft') craftThisWeek.set(a.slot, a);
    else btThisWeek.set(a.slot, a);
  });

  const currentPool = totalPool(targetResult.running);
  const craftable = [];
  const breakable = [];

  for (const s of CONFIG.slots) {
    const cost = CONFIG.slotCost[s.id];
    const craftAction = craftThisWeek.get(s.id);
    const btAction = btThisWeek.get(s.id);

    if (!priorCraft.has(s.id)) {
      const committed = !!craftAction && !craftAction.broken;
      const broken = !!craftAction && craftAction.broken;
      craftable.push({
        slot: s.id, name: s.name, cost,
        committed, broken,
        reason: craftAction?.reason,
        actionId: craftAction?.id,
        affordable: committed || broken || currentPool >= cost,
      });
    }

    const craftedSomehow = priorCraft.has(s.id) || (craftAction && !craftAction.broken);
    const showBreak = (craftedSomehow || btAction) && !priorBT.has(s.id);
    if (showBreak) {
      const committed = !!btAction && !btAction.broken;
      const broken = !!btAction && btAction.broken;
      breakable.push({
        slot: s.id, name: s.name, cost,
        committed, broken,
        reason: btAction?.reason,
        actionId: btAction?.id,
        affordable: committed || broken || currentPool >= cost,
      });
    }
  }
  return { craftable, breakable };
}

/* ────────────────────────────────────────────────────────────
 * Components
 * ──────────────────────────────────────────────────────────── */

function Gate({ gateNum, gate, canSkip, onDifficultyChange, onExtraChange }) {
  const skipped = !gate.difficulty;
  const drops = skipped ? { thorn: 0, frag: 0 } : CONFIG.drops[gateNum][gate.difficulty];
  const mult = gate.extra && !skipped ? CONFIG.extraRewardMultiplier : 1;
  const showThorn = drops.thorn > 0;
  const showFrag  = drops.frag > 0;

  const handleDiffClick = (id) => {
    if (canSkip && gate.difficulty === id) {
      onDifficultyChange(null);              // toggle-off → skip
    } else {
      onDifficultyChange(id);
    }
  };

  return (
    <div className="gate">
      <div className="gate-label">
        <span className="tag">G{gateNum}</span>
        <span className="gate-drops">
          {skipped
            ? 'skipped'
            : (<>
                {showThorn && <><span className="val">{drops.thorn * mult}</span> thorn </>}
                {showFrag  && <><span className="val frag">{drops.frag * mult}</span> frag </>}
              </>)
          }
        </span>
      </div>
      <div className="diff-toggle">
        {DIFFICULTIES.map(d => (
          <button
            key={d.id}
            className={`diff-btn ${gate.difficulty === d.id ? 'active' : ''} ${canSkip ? 'skippable' : ''}`}
            onClick={() => handleDiffClick(d.id)}
            title={canSkip && gate.difficulty === d.id ? 'Click again to skip this gate' : undefined}
          >
            {d.label}
          </button>
        ))}
      </div>
      <div className={`extra-reward ${skipped ? 'disabled' : ''}`}
           onClick={() => !skipped && onExtraChange(!gate.extra)}>
        <input
          type="checkbox"
          checked={gate.extra && !skipped}
          disabled={skipped}
          onChange={e => onExtraChange(e.target.checked)}
          onClick={e => e.stopPropagation()}
        />
        <label>Buy box (×2)</label>
      </div>
    </div>
  );
}

function Week({ idx, week, result, onUpdate, onDelete, weeks, isOnly, onAddWeek }) {
  const avail = useMemo(() => availabilityAt(weeks, idx), [weeks, idx]);

  const setGate = (gateNum, patch) => {
    onUpdate({
      ...week,
      gates: { ...week.gates, [gateNum]: { ...week.gates[gateNum], ...patch } },
    });
  };

  const addAction = (type, slot) => {
    onUpdate({
      ...week,
      actions: [...week.actions, { type, slot, id: `${Date.now()}-${Math.random()}` }],
    });
  };

  const removeAction = (actionId) => {
    onUpdate({ ...week, actions: week.actions.filter(a => a.id !== actionId) });
  };

  return (
    <div className={`week ${result.anyBroken ? 'broken' : ''}`} data-week-id={week.id}>
      <button className="week-add-vert top" onClick={onAddWeek} title="Add week">+ Add</button>
      <div className="week-header">
        <div className="week-title">
          <span>Week</span>
          <span className="week-num">{String(idx + 1).padStart(2, '0')}</span>
        </div>
        {!isOnly && (
          <button className="week-delete" onClick={onDelete}>Delete</button>
        )}
      </div>

      <div className="actions-section-label">Craft</div>
      <div className="action-stack">
        {avail.craftable.length === 0 && (
          <div className="empty-msg">All six pieces crafted.</div>
        )}
        {avail.craftable.map(a => {
          const onClick = () => {
            if (a.committed || a.broken) removeAction(a.actionId);
            else addAction('craft', a.slot);
          };
          const cls = `action-btn ${a.committed ? 'committed' : ''} ${a.broken ? 'broken' : ''}`;
          const title = a.committed ? 'Click to uncommit' : (a.broken ? 'Click to remove' : undefined);
          return (
            <button key={`c-${a.slot}`} className={cls} disabled={!a.affordable} onClick={onClick} title={title}>
              <span className="action-icon">{GearIcons[a.slot]}</span>
              <span className="action-verb">Craft</span>
              <span className="action-name">
                {a.name}
                {a.broken && a.reason && <span className="action-reason">· {a.reason}</span>}
              </span>
              <span className="action-cost">{a.cost} mats</span>
            </button>
          );
        })}
      </div>

      <div className="actions-section-label">Breakthrough</div>
      <div className="action-stack">
        {avail.breakable.length === 0 && (
          <div className="empty-msg">No pieces ready for breakthrough. Craft first.</div>
        )}
        {avail.breakable.map(a => {
          const onClick = () => {
            if (a.committed || a.broken) removeAction(a.actionId);
            else addAction('breakthrough', a.slot);
          };
          const cls = `action-btn ${a.committed ? 'committed' : ''} ${a.broken ? 'broken' : ''}`;
          const title = a.committed ? 'Click to uncommit' : (a.broken ? 'Click to remove' : undefined);
          return (
            <button key={`b-${a.slot}`} className={cls} disabled={!a.affordable} onClick={onClick} title={title}>
              <span className="action-icon">{GearIcons[a.slot]}</span>
              <span className="action-verb">Break</span>
              <span className="action-name">
                {a.name}
                {a.broken && a.reason && <span className="action-reason">· {a.reason}</span>}
              </span>
              <span className="action-cost">{a.cost} mats</span>
            </button>
          );
        })}
      </div>

      <div className="gates">
        <Gate
          gateNum={1}
          gate={week.gates[1]}
          canSkip={false}
          onDifficultyChange={(d) => setGate(1, { difficulty: d })}
          onExtraChange={(v) => setGate(1, { extra: v })}
        />
        <Gate
          gateNum={2}
          gate={week.gates[2]}
          canSkip={true}
          onDifficultyChange={(d) => setGate(2, { difficulty: d })}
          onExtraChange={(v) => setGate(2, { extra: v })}
        />
      </div>

      <div className="week-running">
        <div className="week-running-item">
          <span className="week-running-label">Remaining after week</span>
          <span className="week-running-val">{result.running.thorn} thorn</span>
          <span className="week-running-val frag">· {result.running.frag} frag</span>
          <span className="week-running-label">· total {totalPool(result.running)}</span>
        </div>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────
 * Root
 * ──────────────────────────────────────────────────────────── */

function makeEmptyWeek() {
  return {
    id: `w-${Date.now()}-${Math.random()}`,
    gates: {
      1: { difficulty: 'hard', extra: true },
      2: { difficulty: 'hard', extra: true },
    },
    actions: [],
  };
}

function App() {
  const [weeks, setWeeks] = useState(() => [makeEmptyWeek()]);
  const [showConfig, setShowConfig] = useState(false);
  const [rowButtons, setRowButtons] = useState([]);
  const justAddedRef = useRef(false);
  const weeksRef = useRef(null);

  const sim = useMemo(() => simulate(weeks), [weeks]);

  // When a week is appended, scroll to it — no-op if it's already visible
  // on the current row; scrolls down when the new week wrapped onto a new row.
  useEffect(() => {
    if (!justAddedRef.current) return;
    justAddedRef.current = false;
    const els = document.querySelectorAll('.week');
    els[els.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, [weeks.length]);

  // Measure each row's Y position (for one floating '+' per non-final row).
  // Skips the row containing the last week, since the big end pill handles it.
  useEffect(() => {
    const container = weeksRef.current;
    if (!container) return;
    const compute = () => {
      const cards = Array.from(container.querySelectorAll('[data-week-id]'));
      if (!cards.length) { setRowButtons([]); return; }
      const cRect = container.getBoundingClientRect();
      const rows = new Map();       // top → {top, height}
      cards.forEach(card => {
        const r = card.getBoundingClientRect();
        const top = Math.round(r.top);
        const existing = rows.get(top);
        if (!existing) rows.set(top, { top, height: r.height });
        else existing.height = Math.max(existing.height, r.height);
      });
      const sorted = [...rows.values()].sort((a, b) => a.top - b.top);
      const nonFinal = sorted.slice(0, -1);
      const btns = nonFinal.map(r => ({ y: r.top - cRect.top + r.height / 2 }));
      setRowButtons(prev => {
        if (prev.length === btns.length && prev.every((p, i) => Math.round(p.y) === Math.round(btns[i].y))) return prev;
        return btns;
      });
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(container);
    return () => ro.disconnect();
  }, [weeks.length]);

  const updateWeek = (idx, next) => setWeeks(ws => ws.map((w, i) => i === idx ? next : w));
  const deleteWeek = (idx)       => setWeeks(ws => ws.filter((_, i) => i !== idx));
  const addWeek = () => {
    const last = weeks[weeks.length - 1];
    justAddedRef.current = true;
    setWeeks(ws => [...ws, {
      id: `w-${Date.now()}-${Math.random()}`,
      gates: { 1: { ...last.gates[1] }, 2: { ...last.gates[2] } },
      actions: [],
    }]);
  };
  const resetAll = () => {
    if (confirm('Reset the entire planner? All weeks will be cleared.')) {
      setWeeks([makeEmptyWeek()]);
    }
  };

  return (
    <>
      <div className="header">
        <div className="title-row">
          <img className="palm" src="assets/palm.png" alt="" aria-hidden="true" />
          <h1>Serca's Ledger</h1>
          <img className="palm palm-flip" src="assets/palm.png" alt="" aria-hidden="true" />
        </div>
      </div>

      <div className="ledger">
        <div className="ledger-pool thorn">
          <div className="pool-icon"><ThornIcon /></div>
          <div className="pool-data">
            <div className="pool-value">{sim.finalRunning.thorn}</div>
            <div className="pool-label">Agony Thorn</div>
          </div>
        </div>
        <div className="ledger-pool frag">
          <div className="pool-icon"><FragIcon /></div>
          <div className="pool-data">
            <div className="pool-value">{sim.finalRunning.frag}</div>
            <div className="pool-label">Fragmented</div>
          </div>
        </div>
        <div className="ledger-pool">
          <div className="pool-data">
            <div className="pool-value">{totalPool(sim.finalRunning)}</div>
            <div className="pool-label">Spendable pool</div>
          </div>
        </div>
        <button className="ledger-reset" onClick={resetAll}>Reset</button>
      </div>

      <div className="weeks-scroll">
        <div className="weeks" ref={weeksRef}>
          {weeks.map((w, i) => (
            <Week
              key={w.id}
              idx={i}
              week={w}
              result={sim.weekResults[i]}
              weeks={weeks}
              isOnly={weeks.length === 1}
              onAddWeek={addWeek}
              onUpdate={(next) => updateWeek(i, next)}
              onDelete={() => deleteWeek(i)}
            />
          ))}
          <button className="add-week" onClick={addWeek}>
            <span className="add-week-icon">+</span>
            <span>Add Week</span>
          </button>
          {rowButtons.map((b, i) => (
            <button
              key={`row-${i}`}
              className="row-end-add"
              style={{ top: `${b.y}px` }}
              onClick={addWeek}
              aria-label="Add week"
              title="Add week"
            >+</button>
          ))}
        </div>
      </div>

      <div className="footer">
        <div>Fragmented Thorns spend 1:1 with Agony Thorns — the planner burns frag first.</div>
        <div style={{marginTop: '0.5rem'}}>
          <button className="config-toggle" onClick={() => setShowConfig(s => !s)}>
            {showConfig ? '▼ hide numbers' : '▶ view / tune numbers'}
          </button>
        </div>
        {showConfig && (
          <div className="config-panel" style={{marginTop: '1.5rem'}}>
            <h3>Numbers the planner uses</h3>
            <div>G1 — Normal: <code>4 frag</code> · Hard/NM: <code>10 thorn</code></div>
            <div>G2 — Normal: <code>6 frag</code> · Hard/NM: <code>15 thorn</code></div>
            <div>Extra Reward box: <code>×2</code> drops for that gate</div>
            <div style={{marginTop: '0.7rem'}}>Weapon craft/breakthrough: <code>40 mats</code> each</div>
            <div>Each armor piece (helm, chest, gloves, pants, shoulders): <code>15 mats</code> each</div>
            <div style={{marginTop: '1rem', color: 'var(--text-faint)', fontSize: '0.7rem'}}>
              G1 is mandatory. G2: click the active difficulty to skip. Wrong numbers? Edit the <code>CONFIG</code> block at the top of this file.
            </div>
          </div>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
